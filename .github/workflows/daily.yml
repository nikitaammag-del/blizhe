# Публикация выпуска: по правилу владельца на сайт выходит ТОЛЬКО одобренный выпуск.
# Нейросеть здесь не нужна — выпуск уже собран и проверен (см. «Черновик выпуска» и «Одобрить выпуск»).
# Сигналов несколько, потому что расписание GitHub часто опаздывает; лишние запуски ничего не делают.
# Если выпуск не одобрен — ничего не публикуется (на сайте остаётся прошлый), владельцу утром приходит сообщение.
name: Публикация выпуска
on:
  schedule:
    - cron: '10 21 * * *'   # 00:10 МСК
    - cron: '20 0 * * *'    # 03:20 МСК — запасной
    - cron: '20 2 * * *'    # 05:20 МСК — запасной
    - cron: '10 3 * * *'    # 06:10 МСК — запасной + пост в канал
    - cron: '40 3 * * *'    # 06:40 МСК — запасной + пост в канал
    - cron: '10 4 * * *'    # 07:10 МСК — последний шанс до утра
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: blizhe-repo
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
      TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Опубликовать одобренный выпуск
        run: node tools/release.mjs publish
      # Утренний пост в канал: один раз в день, с 06:00 до 13:00 по Москве, только одобренный и прошедший проверку урок
      - name: Пост «Фраза дня» в Telegram-канал
        if: env.TG_BOT_TOKEN != '' && env.TG_CHANNEL_ID != ''
        continue-on-error: true
        run: node tools/channel-post.mjs
      - name: Сохранить
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in daily.json archive preview channel; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet || git commit -m "Выпуск за $(TZ=Europe/Moscow date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
