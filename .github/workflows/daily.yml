# Ежедневная сборка подборки: запускается каждый день и по кнопке (Actions → Run workflow)
name: Ежедневная подборка
on:
  schedule:
    # GitHub запускает расписание «по возможности» и нередко опаздывает на часы или пропускает запуск.
    # Поэтому сигналов несколько, а сборщик умный: если за сегодня (по Москве) всё уже собрано — он просто ничего не делает.
    - cron: '10 21 * * *'   # 00:10 МСК — собрать новый день целиком (урок, слово, события, шутки…)
    - cron: '20 0 * * *'    # 03:20 МСК — запасной сигнал: дособрать то, что не вышло
    - cron: '20 2 * * *'    # 05:20 МСК — ещё один запасной
    - cron: '10 3 * * *'    # 06:10 МСК — утреннее обновление новостей (к 8:00 они самые свежие)
    - cron: '40 3 * * *'    # 06:40 МСК — запасной для новостей
    - cron: '10 4 * * *'    # 07:10 МСК — последний шанс до выхода людей на работу
  workflow_dispatch: {}      # кнопка «Run workflow»: пересобирает всё заново
permissions:
  contents: write
concurrency:
  group: daily-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}   # необязательно: шутки и перевод промптов (GigaChat)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # необязательно: запасной вариант вместо GigaChat
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}             # необязательно: фильмы с рейтингом
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}             # необязательно: автопост «Фраза дня» в Telegram-канал
      TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}           # адрес канала, например @blizhe_daily
      FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # ручной запуск пересобирает всё; по расписанию — только недостающее
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Серверы GigaChat подписаны российским сертификатом Минцифры — без него Node отклонит соединение
      - name: Сертификат Минцифры (для GigaChat)
        if: env.GIGACHAT_AUTH_KEY != ''
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/russian_ca.crt" https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/russian_ca.crt" >> "$GITHUB_ENV"
      - name: Собрать daily.json
        run: node tools/build-daily.mjs
      # Утренний пост в канал: один раз в день, только с 06:00 до 13:00 по Москве (ночные запуски пропускаются сами)
      - name: Пост «Фраза дня» в Telegram-канал
        if: env.TG_BOT_TOKEN != '' && env.TG_CHANNEL_ID != ''
        continue-on-error: true
        run: node tools/channel-post.mjs
      - name: Сохранить в репозиторий
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json archive/
          if [ -d channel ]; then git add channel/; fi   # отметка «сегодня в канал уже публиковали»
          git diff --cached --quiet || git commit -m "Подборка за $(TZ=Europe/Moscow date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true   # если в репозиторий что-то загрузили одновременно
          git push

